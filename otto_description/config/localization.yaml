/**:
  ros__parameters:
    use_sim_time: true
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    
    # --- THE LOCALIZATION CHANGES ---
    mode: localization 
    map_file_name: /home/boris/otto_ws/serialize_map 
    
    # Tell the robot roughly where it is starting
    map_start_pose: [0.0, 0.0, 0.0] 
    # --------------------------------
    
    transform_timeout: 0.5
    map_update_interval: 1.0
    resolution: 0.05
    max_laser_range: 8.0