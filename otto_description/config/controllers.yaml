controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - left_hip_joint
      - left_foot_joint
      - right_hip_joint
      - right_foot_joint
    interface_name: position
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity