controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    hip_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    foot_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

hip_controller:
  ros__parameters:
    joints:
      - left_hip_joint
      - right_hip_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

foot_controller:
  ros__parameters:
    joints:
      - left_foot_joint
      - right_foot_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_foot_joint"]
    right_wheel_names: ["right_foot_joint"]
    wheel_separation: 0.05 
    wheel_radius: 0.03     
    use_stamped_vel: false

    # NEW: Tell the controller how to apply power to reach the target speed
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 2.0
    
    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 3.0
    angular.z.min_velocity: -3.0
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 3.0
