slam_toolbox:
  ros__parameters:
    # Essential Settings
    use_sim_time: true
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping

    # Tuning (How often it updates the map)
    map_update_interval: 1.0
    resolution: 0.05
    max_laser_range: 8.0