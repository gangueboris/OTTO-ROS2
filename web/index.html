<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OTTO Command Center | Becoming Labs</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <header class="top-bar">
        <div class="status-indicator">
            <span class="dot offline" id="ros-status-dot"></span>
            <span id="ros-status-text">DISCONNECTED</span>
        </div>
        
        <div class="toggle-container">
            <span class="toggle-label left">WALK</span>
            <input type="checkbox" id="master-toggle" class="custom-toggle">
            <label for="master-toggle" class="toggle-track"></label>
            <span class="toggle-label right">ROLL</span>
        </div>

        <button id="btn-settings" class="icon-btn">⚙</button>
    </header>

    <main class="dashboard">
        
        <section class="control-zone left-zone">
            <div class="d-pad">
                <button class="d-btn up" data-dir="forward">▲</button>
                <button class="d-btn left" data-dir="left">◀</button>
                <button class="d-btn right" data-dir="right">▶</button>
                <button class="d-btn down" data-dir="backward">▼</button>
                <div class="d-center"></div>
            </div>
        </section>

        <section class="control-zone center-zone">
            <div class="viewport" id="viewport-container">
                <div id="camera-feed" class="feed-layer active">
                    <img id="video-stream" src="" alt="CAMERA OFFLINE" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div id="map-feed" class="feed-layer hidden"></div>
            </div>
            
            <div class="sub-toggle-wrapper hidden" id="viewport-toggle-wrapper">
                <span class="toggle-label left">VISION</span>
                <input type="checkbox" id="viewport-toggle" class="custom-toggle">
                <label for="viewport-toggle" class="toggle-track"></label>
                <span class="toggle-label right">MAP</span>
            </div>
        </section>

        <section class="control-zone right-zone">
            <button id="btn-stop" class="e-stop">STOP</button>
        </section>
        
    </main>

    <aside id="settings-drawer" class="drawer hidden">
        <div class="drawer-header">
            <h2>ENGINEERING BAY</h2>
        </div>
        
        <div class="drawer-content">
            <div id="roll-settings" class="settings-group hidden">
                <label>LINEAR SPEED (m/s) <span id="val-linear">2.0</span></label>
                <input type="range" id="slider-linear" min="0.1" max="3.0" step="0.1" value="2.0">
                
                <label>ANGULAR SPEED (rad/s) <span id="val-angular">1.0</span></label>
                <input type="range" id="slider-angular" min="0.1" max="2.0" step="0.1" value="1.0">
            </div>

            <div id="walk-settings" class="settings-group active">
                <label>STEP DURATION (sec) <span id="val-step">0.5</span></label>
                <input type="range" id="slider-step" min="0.2" max="2.0" step="0.1" value="0.5">
                
                <label>STRIDE PIVOT (rad) <span id="val-pivot">0.52</span></label>
                <input type="range" id="slider-pivot" min="0.1" max="1.0" step="0.05" value="0.52">
            </div>
        </div>
    </aside>
    
    <script src="https://cdn.jsdelivr.net/npm/eventemitter2@6/lib/eventemitter2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
    
    <script src="https://code.createjs.com/1.0.0/easeljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ros2d@0.10.0/build/ros2d.min.js"></script>
    
    <script src="app.js"></script>
</body>
</html>
